name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: |
          pnpm exec vue-tsc --noEmit
          pnpm exec tsc --noEmit -p tsconfig.node.json

      - name: Vite Build
        run: pnpm exec vite build

  package:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 不用 pnpm run build：必须显式 --publish never。electron-builder v26 在 CI 上
      # 检测到 tag 时默认 publish=onTag（v27 才移除），发布由下方 release job 统一负责；
      # 且 pnpm run 追加参数会被 sh -c 吞成位置参数，故展开为显式链（单行 && 兼
      # 容 Windows pwsh，多行脚本中间失败不会中断）
      - name: Build Release Files
        run: pnpm exec vue-tsc --noEmit && pnpm exec tsc --noEmit -p tsconfig.node.json && pnpm exec vite build && pnpm exec electron-builder --publish never

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          # release/${version}/ 里还有 win-unpacked/（含原始 exe，400MB+）、
          # linux-unpacked/、blockmap、latest*.yml 等，只收两个安装包
          path: |
            release/*/*.exe
            release/*/*.AppImage
          if-no-files-found: error
          retention-days: 5

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.AppImage
